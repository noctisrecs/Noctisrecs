<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noctis x FiveWays</title>
    <link rel="icon" href="images/favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img class="logo" src="images/logo.png" alt="Noctis" />

    <h1>RSVP</h1>

    <form id="rsvp-form" action="https://formspree.io/f/xljdkkql" method="POST">
      <input type="text" name="first" placeholder="Name" required />
      <input type="email" name="email" placeholder="Email Address" required />
      <button type="submit">Send</button>
      <p id="form-error" hidden>Something went wrong. Please try again.</p>
    </form>

    <script>
      const form = document.getElementById("rsvp-form");
      const error = document.getElementById("form-error");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        error.hidden = true;

        try {
          const response = await fetch(form.action, {
            method: "POST",
            body: new FormData(form),
            headers: { Accept: "application/json" },
          });

          if (response.ok) {
            window.location.href = "bedankt.html";
          } else {
            error.hidden = false;
          }
        } catch {
          error.hidden = false;
        }
      });
    </script>
  </body>
</html>
